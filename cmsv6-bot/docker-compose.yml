services:
  # Servidor propio de Telegram Bot API: permite enviar videos de hasta 2 GB
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - botapi:/var/lib/telegram-bot-api
      - ./data:/data

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_API_URL: http://telegram-bot-api:8081
      DATA_DIR: /data
    depends_on:
      - telegram-bot-api
    ports:
      - "${HTTP_PORT:-8088}:${HTTP_PORT:-8088}"
    volumes:
      - ./data:/data

volumes:
  botapi:
