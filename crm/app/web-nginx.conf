# Página web del CRM (export estático de Expo). Equivale a la configuración
# que tenía en Vercel (public/vercel.json): direcciones sin ".html" y
# /case/<id> servido por la página genérica case/[id].html.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/case/[^/.]+$ {
        try_files $uri.html "/case/[id].html";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /+not-found.html;
}
